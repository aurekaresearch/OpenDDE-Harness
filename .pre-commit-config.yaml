default_language_version:
  python: python3.12

exclude: '^ui-tui/src/rpc/generated\.ts$'

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: local
    hooks:
      - id: eslint-ui-tui
        name: eslint (ui-tui)
        entry: bash -c '[ -d ui-tui/node_modules ] || exit 0; cd ui-tui && npm run lint'
        language: system
        pass_filenames: false
        files: '^ui-tui/src/.*\.(ts|tsx)$'

      - id: prettier-ui-tui
        name: prettier (ui-tui)
        entry: bash -c '[ -d ui-tui/node_modules ] || exit 0; cd ui-tui && npx prettier --check "src/**/*.{ts,tsx}"'
        language: system
        pass_filenames: false
        files: '^ui-tui/src/.*\.(ts|tsx)$'
