name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    name: pre-commit diff
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install dependencies
        run: make install-deps

      - name: Run pre-commit on changed files
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            uv run pre-commit run --all-files
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            uv run pre-commit run --all-files
          else
            uv run pre-commit run --from-ref "$BASE" --to-ref HEAD
          fi

  lint-python:
    name: python lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install dependencies
        run: make install-deps

      - name: Focused Python lint
        run: make lint-python

  pytest:
    name: python tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run tests
        run: uv run pytest -q

  client-smoke:
    name: client startup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install client dependencies
        run: uv sync --locked --dev
      - name: Check CLI without compute resources
        run: |
          uv run ddeharness --version
          uv run ddeharness --help
          uv run ddeharness compute prepare --help

  tui:
    name: TUI checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui-tui/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ui-tui

      - name: Lint, type-check, and test
        run: |
          npm run lint
          npm run lint:rpc
          npm run type-check
          npm test
          npm run build
        working-directory: ui-tui
