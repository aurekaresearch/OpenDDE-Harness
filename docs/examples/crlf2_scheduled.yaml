# CRLF2-VHH example with exploration-to-refinement cycle intervals.
# Cycles are zero-based and both interval endpoints are inclusive.
#
# After compute setup, ask the TUI to review and run this YAML by its absolute path.
# Task state defaults to ~/.opendde_harness/protein_design/<task_id>/; compute outputs live on the compute host.
# Long-term cases and learned skills use protein-design/CRLF2 because target.name
# below is CRLF2. The target name is used exactly as written.

# Optional remote placement. Omit this block to use the plugin's default
# compute URL, or uncomment it to pin the complete task to one Docker service.
# compute:
#   url: http://127.0.0.1:8080

# Full parameter reference: docs/protein-design-yaml.md.
# Defaults: loss objective, standard contact gates, terminal refolding disabled.
design:
  n_cycles: 10
  num_sequences: 8
  reflection_interval: 5
  num_mutations: 1-10

  # Weighted mode draws one legal strategy per cycle, not a fixed within-batch quota.
  router_selection_strategy: weighted
  population_size: 20
  cycle_schedule:
    - start_cycle: 0
      end_cycle: 3
      num_sequences: 8
      population_size: 24
      parent_fitness_temperature: 1.5
      router_skill_probabilities:
        cdr-full-redesign: 0.8
        cdr-point-mutation: 0.2
    - start_cycle: 4
      end_cycle: 6
      num_sequences: 4
      population_size: 12
      parent_fitness_temperature: 0.5
      router_skill_probabilities:
        cdr-full-redesign: 0.4
        cdr-point-mutation: 0.6
    - start_cycle: 7
      end_cycle: 9
      num_sequences: 2
      population_size: 6
      parent_fitness_temperature: 0.15
      router_skill_probabilities:
        cdr-full-redesign: 0.1
        cdr-point-mutation: 0.9

  esm_device: cuda:0

fold:
  # These local-folding settings need adaptation for API mode; see docs/protein-design.md.
  model: opendde
  gpus: "0,1,2,3,4,5,6,7"
  seeds: [973520]
  use_msa: false
  enable_msa_search: false

target:
  name: CRLF2
  chains:
    A:
      sequence: QGGAAEGVQIQIIYFNLETVQVTWNASKYSRTNLTFHYRFNGDEAYDQCTNYLLQEGHTSGCLLDAEQRDDILYFSIRNGTHPVFTASRWMVYYLKPSSPKHVRFSWHQDAVTVTCSDLSYGDLLYEVQYRSPFDTEWQSKQENTCNVTIEGLDAEKCYSFWVRVKAMEDVYGPDTYPSDWSEVTCWQRGEIRDACAETPTPPKPKLSK

initial_binders:
  - name: init_CRLF2_validated_VHH
    chains:
      D:
        sequence: EVQLVESGGGLVQPGGSLRLSCAASPAPSGPLYLHWFRQAPGQEREFVASINSSSTSTYYADSVRGRFTNSRDNSKNTLYLQMNSLRAEDTAVYYCAAYPYPPPPPEGPPPPGPFGQGTLVTVSS
        # Position ranges are zero-based and inclusive at both ends.
        # Framework positions outside these CDRs are fixed automatically.
        cdr_regions: "25:34,49:58,98:114"
        chain_type: VHH
