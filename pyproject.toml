[project]
name = "opendde-harness"
version = "0.0.1"
description = "OpenDDE Harness - antibody design harness: agent runtime, protein-design plugin, and compute service"
requires-python = ">=3.12"
license =  "Apache-2.0"
license-files = ["LICENSE", "LICENSES/*.txt"]
authors = [
    {name = "OpenDDE"}
]
keywords = ["antibody-design", "protein-design", "agent", "cli", "bioinformatics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "typer>=0.20.0,<1.0.0",
    "litellm>=1.82.1,<2.0.0",
    "pydantic>=2.12.0,<3.0.0",
    "pydantic-settings>=2.14.2,<3.0.0",
    "httpx>=0.28.0,<1.0.0",
    "loguru>=0.7.3,<1.0.0",
    "rich>=14.0.0,<15.0.0",
    "pyyaml>=6.0",
    "prompt-toolkit>=3.0.0",
    "json-repair>=0.30.0",
    # Token-aware truncation in the long-term memory library (text.py).
    # Currently also a transitive dep of litellm — pinning it directly so the
    # memory extractor keeps working if upstream ever drops it.
    "tiktoken>=0.7.0,<1.0.0",
    "questionary>=2.0.0,<3.0.0",
    "watchfiles>=0.21,<2.0",
    "everos[multimodal]==1.2.2",
    "tomli-w>=1.2.0",
    "portalocker>=3.2.0",
    "mcp>=1.27.0",
    "orjson>=3.11.6,<4.0",
    # Array math across the protein-design plugin. Also a transitive dep
    # (via lancedb) -- pinned directly so it keeps working if that drops.
    "numpy>=2.0,<3.0",
    # Image downscale/recompress for read_file (agent/tools/media.py). Reaches
    # us anyway via the memory library's multimodal extra -> everalgo-parser, but that is a
    # three-hop transitive path — pinning it directly so reading an image keeps
    # working if any link in that chain drops it.
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]
protein-design = [
    "fastapi>=0.116,<1.0",
    "uvicorn>=0.35,<1.0",
    "biotite>=1.2,<2.0",
    "gradio-client>=0.10.0",
    "scipy>=1.10.0",
    "torch>=2.3.0,<2.8.0",
    "transformers>=4.30.0",
]

[project.scripts]
ddeharness = "opendde_harness.cli.commands:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["opendde_harness"]

[tool.hatch.build.targets.wheel.force-include]
# The quickstart designs the agent reads before writing a new one. Without them
# in the wheel, an installed release had no examples at all: they were found by
# locating a source checkout, which a pip install does not have.
"docs/examples/crlf2_quickstart.yaml" = "opendde_harness/plugin/protein_design/examples/crlf2_quickstart.yaml"
"docs/examples/cacng1_quickstart.yaml" = "opendde_harness/plugin/protein_design/examples/cacng1_quickstart.yaml"
"docker/versions.env" = "opendde_harness/cli/source_versions.env"
"docker/environment.json" = "opendde_harness/cli/compute_environment.json"
"docker/model-checksums.sha256" = "opendde_harness/cli/model-checksums.sha256"
"docker/ESM-LICENSE.txt" = "opendde_harness/cli/esm-model-license.txt"

# The prebuilt, self-contained TUI bundle (ui-tui/dist/entry.js) is packaged
# into the wheel as opendde_harness/ui-tui/dist so `pip`/`uv tool install` yields a
# working `opendde tui` with no source checkout. It is added *conditionally* by
# the custom build hook below (hatch_build.py) — a static force-include would
# hard-fail when dist/ is absent (it's gitignored), breaking `git clone && uv
# sync`. CI builds the bundle before building the release wheel
# (see .github/workflows/release.yml).
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build]
include = [
    "opendde_harness/**/*.py",
    "opendde_harness/plugin/**/opendde-harness-plugin.toml",
    "opendde_harness/templates/**/*.md",
    "opendde_harness/memory_engine/skills/**/*.md",
    "opendde_harness/plugin/protein_design/skills/**/*.md",
    "opendde_harness/plugin/protein_design/skills/**/*.yaml",
    "opendde_harness/plugin/protein_design/examples/*.yaml",
    # Bundled model-label snapshot, so a fresh install labels models offline.
    "opendde_harness/providers/data/*.json",
    # Tracing dashboard viewer (dependency-free Node server + static client).
    "opendde_harness/tracing/viewer/**/*.js",
    "opendde_harness/tracing/viewer/**/*.css",
    "opendde_harness/tracing/viewer/**/*.html",
    "opendde_harness/tracing/viewer/**/*.json",
]

[tool.hatch.build.targets.sdist]
include = [
    "docs/examples/*.yaml",
    "docker/versions.env",
    "docker/environment.json",
    "docker/model-checksums.sha256",
    "docker/ESM-LICENSE.txt",
    "opendde_harness/",
    # ``uv build`` creates the wheel from this sdist. Preserve the already
    # built TUI bundle so the wheel hook can package a working ``opendde tui``.
    "ui-tui/dist/entry.js",
    "hatch_build.py",
    "README.md",
    "LICENSE",
]

[tool.hatch.build.targets.sdist.force-include]
"docker/versions.env" = "docker/versions.env"
"docker/environment.json" = "docker/environment.json"
"docker/model-checksums.sha256" = "docker/model-checksums.sha256"
"docker/ESM-LICENSE.txt" = "docker/ESM-LICENSE.txt"
# A release archive without this file installs a broken ``opendde tui``. Make
# the release build fail visibly if the frontend was not built, and preserve
# the bundle when Hatch builds the wheel from the sdist.
"ui-tui/dist" = "ui-tui/dist"

[tool.uv]
constraint-dependencies = [
    "aiohttp>=3.13.4",
    "pip>=26.1.2",
    "pyjwt>=2.13.0",
    "python-engineio>=4.13.3",
    "python-dotenv>=1.2.2",
    "starlette>=1.3.1",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [
    # Third-party sources are cloned separately during compute preparation.
    "external/**",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "S101", "S105", "S106", "S107", "S506", "S605", "S607"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Test conventions: asserts, hardcoded creds in fixtures, naming, redefinition,
# unused variables, deferred imports, ambiguous names — idiomatic in tests, not
# product code.
"tests/**" = ["E402", "E741", "F811", "F841", "N802", "N805", "N806", "N817", "N818", "S101", "S105", "S106", "S107", "S607"]

# CLI startup-order / deferred imports, accepted long-term.
"opendde_harness/cli/commands.py" = ["E402"]
"opendde_harness/memory_engine/skill_local/registry.py" = ["E402"]

# asserts; convert-vs-keep tracked in v2.
"opendde_harness/agent/subagent/manager.py" = ["S101"]
"opendde_harness/cli/doctor_commands.py" = ["S101"]
"opendde_harness/cli/onboard_commands.py" = ["S101"]
"opendde_harness/memory_engine/contract_test.py" = ["S101"]

# scripts/: dev utilities; partial-path subprocess.
"scripts/check_commit_file.py" = ["S607"]
"scripts/check_commit_messages.py" = ["S607"]
"scripts/check_large_files.py" = ["S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/integration", "*.egg", ".*", "build", "dist"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "-m",
    "not integration and not e2e",
]
asyncio_mode = "auto"
markers = [
    "integration: needs a real external resource (LLM / RPC subprocess / VM / network); deselected by default, run with '-m integration' or by pointing at tests/integration",
    "e2e: spawns real subprocesses / drives the full stack (slow); deselected by default, run with '-m e2e' (e.g. tests/tui/autotest)",
    "real_llm: hits a real long-term memory runtime (LLM + embedding); skipped unless the memory LLM and embedding models are configured",
]

[dependency-groups]
dev = [
    "json-repair>=0.59.5",
    "pexpect>=4.9",
    "pip-audit>=2.10.0",
    "pre-commit>=4.6.0",
    "pyte>=0.8",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff==0.15.12",
]
